<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#12214D">
  <meta name="description" content="Live score for a Marquette Catholic High School game.">
  <title>Game · Marquette Catholic Live Scores</title>
  <link rel="icon" href="/favicon.ico" sizes="48x48">
  <link rel="icon" href="/assets/img/favicon-32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="/assets/img/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="stylesheet" href="/assets/css/app.css">
  <script type="module" src="/assets/js/game.js"></script>
</head>
<body class="page-game">
  <a class="skip-link" href="#main">Skip to the score</a>
  <header class="site-header site-header--compact">
    <div class="container container--wide site-header__inner">
      <a class="brand" href="/">
        <img class="brand__logo" src="/assets/img/logo.png" alt="" width="320" height="270">
        <span class="brand__text">
          <span class="brand__school" data-school-name>Marquette Catholic</span>
          <span class="brand__title">Live Scores</span>
        </span>
      </a>
      <div class="site-header__end">
        <span class="conn" role="status" data-conn data-state="connecting" title="Connecting to live updates">
          <span class="conn__dot" aria-hidden="true"></span>
          <span class="conn__label">Connecting…</span>
        </span>
      </div>
    </div>
  </header>

  <main id="main" class="container container--wide">
    <nav class="board-toolbar" aria-label="Game">
      <a class="btn btn--ghost btn--sm" href="/">‹ All scores</a>
      <button class="btn btn--sm" type="button" data-fullscreen aria-pressed="false" hidden>Full screen</button>
    </nav>
    <div data-board></div>
  </main>

  <footer class="site-footer">
    <div class="container container--wide site-footer__inner">
      <p>Follow this game on your Lock Screen with <strong>Sports Updates</strong> in the MCHS app.</p>
      <a class="site-footer__link" href="/">All scores</a>
    </div>
  </footer>
  <noscript><p class="noscript">Live scores need JavaScript. Turn it on to see this game.</p></noscript>
</body>
</html>
